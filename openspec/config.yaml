schema: spec-driven

context: |
  Tech stack: Astro v4.15.2, Vue v3.4.38, TS v5.5.4, Tailwind CSS, pnpm
  Architecture: Static Site Generation (SSG), Component-Driven Development
  Testing: No test runner/framework configured
  Style: Tailwind CSS

testing:
  strict_tdd: false
  test_runner: null
  test_layers:
    unit: false
    integration: false
    e2e: false
  coverage: false
  quality_tools:
    linter: "pnpm build (astro check)"
    type_checker: "pnpm build (astro check)"
    formatter: null

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "pnpm build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
